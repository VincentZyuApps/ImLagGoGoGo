# ========================================================
# ImLagGoGoGo 配置文件范例 (config.example.toml)
# 首次运行会自动生成与本文件同名同构的 config.toml
# ========================================================

[player]
# 玩家 SteamID64 (优先推荐使用)
# 提示: 可前往 https://steamid.io 查询您的 SteamID64，或者查看您的个人主页 URL，末尾纯数字即是。
# 填写 SteamID64 后，无论您在游戏中怎么换昵称、加战队前缀，都能 100% 精准识别本人！
steamid = "76561198307564265"

# 玩家备选昵称列表 (若未填写 steamid 则通过昵称匹配)
# 支持配置多个开黑曾用名，只要匹配其中任意一个即视为本人死亡。
player_names = ["VincentZyu"]

[mode]
# 运行行为模式:
# "both"  - 混合模式 (推荐/默认): 既在死后由 GSI 自动狡辩，平时若按绑定键也能手动触发
# "auto"  - 纯自动模式: 仅在死后由 GSI 全自动狡辩，禁用按键手动发送
# "cfg"   - 纯手动模式: 死后不自动发，仅在 CS2 游戏中按下绑定按键时轮换发送
behavior_mode = "both"

[chat]
# 聊天频道:
# "all"   - 公屏全局聊天 (模拟按 'Y'，默认，让对面也听到借口)
# "team"  - 队内公屏聊天 (模拟按 'U'，仅向队友狡辩)
channel = "all"

# 死亡触发延迟缓冲 (毫秒):
# 推荐 300ms ~ 600ms (默认 555ms)。
# 玩家阵亡时有击杀特写与按键惯性，停顿 555ms 能完美避免按键被游戏硬直吞掉，体感极度真实。
death_delay_ms = 555

# 击键微停顿间隔 (毫秒):
# 呼出聊天框后、输入文字后、按下回车后的微停顿间隔，默认 60ms 即可非常平稳。
key_interval_ms = 60

# 仅在 CS2 为前台窗口时触发发送 (强烈建议保持开启，防止切屏切到桌面/微信时误发)
check_foreground = true

# 全局一键静音快捷键 (开黑残局保命闭麦)
# 默认使用 Ctrl+Shift+S 快速在 [启用 / 静音] 之间切换
toggle_hotkey = "Ctrl+Shift+S"

[network]
# GSI 监听起始端口 (默认 4000)
gsi_port = 4000

# GSI 监听避让最大端口 (默认 4999)
# 若启动时发现 4000 端口已被其他应用占用，程序将在 [4000 ~ 4999] 范围内自动寻找可用端口，
# 并全自动更新 CS2 的 gamestate_integration_imlag.cfg，实现用户完全零感知的端口避让。
max_port = 4999

[corpus]
# 语料借口词库文件名 (与程序同级目录)
file_path = "Messages.txt"

# 词库抽取模式:
# "shuffle" - 洗牌池模式 (默认): 类似扑克牌发牌，随机洗牌后无放回抽样，抽完一整轮再重洗，绝对不连发重复词
# "random"  - 纯随机模式: 每次死亡独立随机抽选 (可能有小概率连续随到同一句)
selection_mode = "shuffle"

# 是否监听 Messages.txt 文件改动并自动热重载 (默认开启)
# 开启后，你在外部记事本按 Ctrl+S 保存词库，程序瞬间无感生效，无需手动刷新。
watch_file = true

# 词库文本编码格式:
# "auto"       - 智能嗅探自动适应 (默认/推荐，支持自动识别 UTF-8, UTF-8 BOM, GBK/GB2312, ANSI, UTF-16)
# "utf-8"      - 强制按标准 UTF-8 读取
# "gbk"        - 强制按 GBK / ANSI 读取
encoding = "auto"

[ui]
# 界面主题模式:
# "system" - 跟随系统 (默认/推荐): 自动跟随 Windows/Linux 操作系统的深浅色模式切换
# "dark"   - 强制深色: CS2 经典暗黑战术 Panorama 风格
# "light"  - 强制浅色: CS2 战术白/雪地迷彩风格
theme = "system"

# 点击主窗口右上角 [X] 关闭按钮时的默认行为:
# "ask"      - 每次弹窗询问 (默认)
# "minimize" - 直接最小化到系统托盘并在后台常驻
# "exit"     - 直接退出程序
close_action = "ask"

# 开机静默启动到托盘 (默认 false，可在设置中勾选开启)
auto_start = false
