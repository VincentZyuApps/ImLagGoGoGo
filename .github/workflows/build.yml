name: Build & Release

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Download Go dependencies
        run: go mod download

      - name: Build binary
        run: |
          go build -ldflags="-s -w -H=windowsgui" -trimpath -o imlag.exe ./cmd/imlag

      - name: Package Release ZIP
        shell: pwsh
        run: |
          $dist = "ImLagGoGoGo-windows-x64"
          New-Item -ItemType Directory -Path $dist -Force | Out-Null
          Copy-Item imlag.exe $dist/
          Copy-Item assets/config.example.toml $dist/
          Copy-Item assets/Messages.example.txt $dist/
          Copy-Item README.md $dist/
          Copy-Item LICENSE $dist/
          Compress-Archive -Path "$dist/*" -DestinationPath "ImLagGoGoGo-windows-x64.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImLagGoGoGo-windows-x64
          path: ImLagGoGoGo-windows-x64.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF -like "refs/tags/*") { $env:GITHUB_REF.Substring(10) } else { "v0.1.0" }
          gh release delete $tag --yes --cleanup-tag 2>$null || $true
          gh release create $tag `
            --title "ImLagGoGoGo $tag (CS2 战术死后狡辩系统 - Beta)" `
            --notes "### 🎮 ImLagGoGoGo $tag (Beta)`n`n基于 Go 1.24 重构，纯静态单二进制，仅约 7MB 体积，原生 CS2 沉浸式战术 UI。`n`n- 彻底杜绝拼音输入法候选框吞字`n- 洗牌池无放回借口轮转`n- 智能端口冲突避让 (4000~4999)`n- 全自动/手动按键双模支持" `
            --latest `
            ImLagGoGoGo-windows-x64.zip
